; JK-BMS Web — ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM)
; Платформа pioarduino: Arduino core 3.x на ESP-IDF 5.x

[platformio]
default_envs = esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.1
    ESP32Async/AsyncTCP @ ^3.5.0
    ESP32Async/ESPAsyncWebServer @ ^3.12.1
    bblanchon/ArduinoJson @ ^7.4.3

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    ; NimBLE: нам потрібна лише роль central, одне з'єднання
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Прошивка через USB
[env:esp32s3]

; Прошивка по мережі (ArduinoOTA). Пароль = пароль вебморди.
; pio run -e esp32s3_ota -t upload
[env:esp32s3_ota]
upload_protocol = espota
upload_port = jkbms.local
upload_flags =
    --auth=admin
